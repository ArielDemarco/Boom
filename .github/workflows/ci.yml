name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test
        run: swift build && swift test

  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Boom-Package \
            -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' \
            | xcbeautify
