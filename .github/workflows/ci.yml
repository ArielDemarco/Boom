name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test
        run: swift build && swift test

  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | awk -F'[()]' '{print $2}')
          xcodebuild test \
            -scheme Boom-Package \
            -destination "platform=iOS Simulator,id=$UDID" \
            | xcbeautify
